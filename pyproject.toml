[project]
name = "raspberrygirl-text-input"
version = "0.1.0"
description = "Raspberry Girl text input module: typed console lines -> waycast input frames."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "noteas", email = "3818384646@qq.com" }
]
dependencies = [
    "httpx2[ws]>=2.16,<3",
    "python-dotenv>=1,<2",
]

[project.scripts]
text-input = "text_input.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "basedpyright>=1.31,<2",
    "pytest>=8",
    "ruff>=0.12",
    # 测试假 hub 用 websockets.serve 起服务端——与真实 waycast hub 同一服务端栈
    # （uvicorn[standard] 之下就是 websockets），用它验证 httpx2 客户端的真实互操作。
    "websockets>=17.4,<18",
]

[tool.hatch.build.targets.wheel]
packages = ["src/text_input"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
filterwarnings = ["error"]

[tool.pyright]
typeCheckingMode = "strict"
include = ["src"]
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = "none"

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
