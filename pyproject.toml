[project]
name = "loom"
version = "0.1.0"
description = "Raspberry Girl text input module: typed console lines -> waycast input frames."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "noteas", email = "3818384646@qq.com" }
]
# 版本策略：语义化区间（下界=当前目标版本，上界=下一 major），可复现性由 uv.lock 保证。
dependencies = [
    "python-dotenv>=1,<2",
    "websockets>=17.4,<18",
]

[project.scripts]
loom = "loom.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "basedpyright>=1.31,<2",
    "pytest>=8",
    "ruff>=0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/loom"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
filterwarnings = ["error"]

[tool.pyright]
typeCheckingMode = "strict"
include = ["src"]
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = "none"

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

# lint 规则集 = ruff 内置默认（四仓一致，不另选规则族；生效规则集由 uv.lock 钉死的 ruff 版本决定）。
